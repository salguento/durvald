name: Materialize item 5 implementation

on:
  push:
    branches: [codex/item-5-section-diagnostics]
    paths:
      - .github/workflows/materialize-item5-implementation.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/item-5-section-diagnostics
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply implementation patch
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/apply-item5-section-diagnostics.yml').read_text()
          start_marker = '      - name: Apply source patch\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Format and test Rust\n'
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'item5_patch.py', 'exec'), {'__name__': '__main__'})

      - name: Format Rust
        run: cargo fmt --manifest-path durvald-core/Cargo.toml --all

      - name: Generate Swift bindings
        run: ./durvald-core/scripts/generate-swift-bindings.sh

      - name: Check hand-edited patch cleanliness
        run: |
          git diff --check -- \
            ':(exclude)durvald-macos/Durvald/Durvald/durvald_core.swift' \
            ':(exclude)durvald-macos/Durvald/Generated/**'

      - name: Commit implementation
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-item5-section-diagnostics.yml \
            .github/workflows/apply-item5-section-diagnostics-v2.yml \
            .github/workflows/fix-item5-apply.yml \
            .github/workflows/diagnose-item5-macos.yml \
            .github/workflows/materialize-item5-implementation.yml \
            item5-xcodebuild.log \
            item5-xcodebuild-test-errors.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Implement section-level enrichment diagnostics"
          git push origin HEAD:codex/item-5-section-diagnostics
