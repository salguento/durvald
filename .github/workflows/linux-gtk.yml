name: Linux GTK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gtk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: durvald-gtk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libasound2-dev libudev-dev libssl-dev
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
