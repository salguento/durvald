name: Apply item 5 section diagnostics v2

on:
  push:
    branches: [codex/item-5-section-diagnostics]
    paths:
      - .github/workflows/apply-item5-section-diagnostics-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/item-5-section-diagnostics
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Reuse source patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-item5-section-diagnostics.yml').read_text()
          start_marker = '      - name: Apply source patch\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Format and test Rust\n'
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('could not locate source patch block')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(body, 'item5_patch.py', 'exec'), {'__name__': '__main__'})

      - name: Format and test Rust
        run: |
          cd durvald-core
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --package durvald-core
          cargo build --package durvald-core --features uniffi --release

      - name: Generate Swift bindings
        run: |
          ./durvald-core/scripts/generate-swift-bindings.sh

      - name: Build and test macOS client
        run: |
          cd durvald-macos/Durvald
          xcodebuild -project Durvald.xcodeproj -scheme Durvald -configuration Debug -destination 'platform=macOS' build
          xcodebuild -project Durvald.xcodeproj -scheme Durvald -destination 'platform=macOS' test

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/apply-item5-section-diagnostics.yml \
            .github/workflows/apply-item5-section-diagnostics-v2.yml \
            .github/workflows/fix-item5-apply.yml
          git add -A
          git commit -m "Implement section-level enrichment diagnostics"
          git push origin HEAD:codex/item-5-section-diagnostics
