name: Apply item 5 section diagnostics

on:
  push:
    branches: [codex/item-5-section-diagnostics]
    paths:
      - .github/workflows/apply-item5-section-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/item-5-section-diagnostics
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Apply source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          api = "durvald-core/src/api/enrichment.rs"
          replace_once(
              api,
              '''/// Durable cover-queue counters for the artist's active catalog snapshot.\n''',
              '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = "snake_case")]\n#[cfg_attr(feature = "uniffi", derive(uniffi::Enum))]\npub enum ArtistRefreshDiagnosticCode {\n    Timeout,\n    ConnectionFailed,\n    InvalidResponse,\n    InvalidImage,\n    DatabaseBusy,\n    ProviderUnavailable,\n}\n\n/// Durable cover-queue counters for the artist's active catalog snapshot.\n'''
          )
          replace_once(
              api,
              '''pub struct ArtistRefreshSectionResult {\n    pub section: ArtistRefreshSection,\n    pub status: ArtistRefreshStatus,\n    pub retry_after_seconds: Option<u64>,\n    pub cover_progress: Option<CoverRefreshProgress>,\n}\n''',
              '''pub struct ArtistRefreshSectionResult {\n    pub section: ArtistRefreshSection,\n    pub status: ArtistRefreshStatus,\n    pub retry_after_seconds: Option<u64>,\n    pub cover_progress: Option<CoverRefreshProgress>,\n    /// Stable machine-readable cause. UI strings remain frontend-owned.\n    pub diagnostic: Option<ArtistRefreshDiagnosticCode>,\n    /// Primary provider for the section. A profile may aggregate multiple providers.\n    pub provider: Option<EnrichmentProvider>,\n}\n'''
          )

          udl = "durvald-core/src/durvald.udl"
          replace_once(
              udl,
              '''[Rust="enum"]\ntypedef extern ArtistRefreshStatus;\n\n[Rust="record"]\ntypedef extern CoverRefreshProgress;\n''',
              '''[Rust="enum"]\ntypedef extern ArtistRefreshStatus;\n\n[Rust="enum"]\ntypedef extern ArtistRefreshDiagnosticCode;\n\n[Rust="record"]\ntypedef extern CoverRefreshProgress;\n'''
          )

          service = "durvald-core/src/enrichment/service.rs"
          replace_once(
              service,
              '''                        results.push(ArtistRefreshSectionResult {\n                            section: ArtistRefreshSection::Profile,\n                            status: outcome.profile_status,\n                            retry_after_seconds: None,\n                            cover_progress: None,\n                        });\n''',
              '''                        results.push(refresh_section_result(\n                            ArtistRefreshSection::Profile,\n                            outcome.profile_status,\n                            None,\n                            None,\n                            None,\n                        ));\n'''
          )
          replace_once(
              service,
              '''                        let (status, retry_after_seconds) = match outcome.commons_file {\n''',
              '''                        let (status, retry_after_seconds, diagnostic) = match outcome.commons_file {\n'''
          )
          replace_once(
              service,
              '''                                    Ok(status) => (status, None),\n                                    Err(error) => refresh_transport_error(&error),\n''',
              '''                                    Ok(status) => (status, None, None),\n                                    Err(error) => refresh_transport_error(&error),\n'''
          )
          replace_once(
              service,
              '''                            None => (ArtistRefreshStatus::NotFound, None),\n                        };\n                        results.push(ArtistRefreshSectionResult {\n                            section: ArtistRefreshSection::Portrait,\n                            status,\n                            retry_after_seconds,\n                            cover_progress: None,\n                        });\n''',
              '''                            None => (ArtistRefreshStatus::NotFound, None, None),\n                        };\n                        results.push(refresh_section_result(\n                            ArtistRefreshSection::Portrait,\n                            status,\n                            retry_after_seconds,\n                            None,\n                            diagnostic,\n                        ));\n'''
          )
          replace_once(
              service,
              '''                    let (status, retry) = refresh_transport_error(&error);\n''',
              '''                    let (status, retry, diagnostic) = refresh_transport_error(&error);\n'''
          )
          replace_once(
              service,
              '''                            results.push(ArtistRefreshSectionResult {\n                                section,\n                                status,\n                                retry_after_seconds: retry,\n                                cover_progress: None,\n                            });\n''',
              '''                            results.push(refresh_section_result(\n                                section,\n                                status,\n                                retry,\n                                None,\n                                diagnostic,\n                            ));\n'''
          )
          replace_once(
              service,
              '''            let (status, retry_after_seconds) = match self\n                .refresh_discography_once(&identity, request.force)\n                .await\n            {\n                Ok(status) => (status, None),\n                Err(error) => refresh_transport_error(&error),\n            };\n            results.push(ArtistRefreshSectionResult {\n                section: ArtistRefreshSection::Discography,\n                status,\n                retry_after_seconds,\n                cover_progress: None,\n            });\n''',
              '''            let (status, retry_after_seconds, diagnostic) = match self\n                .refresh_discography_once(&identity, request.force)\n                .await\n            {\n                Ok(status) => (status, None, None),\n                Err(error) => refresh_transport_error(&error),\n            };\n            results.push(refresh_section_result(\n                ArtistRefreshSection::Discography,\n                status,\n                retry_after_seconds,\n                None,\n                diagnostic,\n            ));\n'''
          )
          replace_once(
              service,
              '''            let (status, retry_after_seconds, cover_progress) =\n                match self.refresh_covers_once(&identity, request.force).await {\n                    Ok(outcome) => (outcome.status, None, Some(outcome.progress)),\n                    Err(error) => {\n                        let (status, retry) = refresh_transport_error(&error);\n''',
              '''            let (status, retry_after_seconds, cover_progress, diagnostic) =\n                match self.refresh_covers_once(&identity, request.force).await {\n                    Ok(outcome) => (outcome.status, None, Some(outcome.progress), None),\n                    Err(error) => {\n                        let (status, retry, diagnostic) = refresh_transport_error(&error);\n'''
          )
          replace_once(
              service,
              '''                        (status, retry, progress)\n                    }\n                };\n            results.push(ArtistRefreshSectionResult {\n                section: ArtistRefreshSection::Covers,\n                status,\n                retry_after_seconds,\n                cover_progress,\n            });\n''',
              '''                        (status, retry, progress, diagnostic)\n                    }\n                };\n            results.push(refresh_section_result(\n                ArtistRefreshSection::Covers,\n                status,\n                retry_after_seconds,\n                cover_progress,\n                diagnostic,\n            ));\n'''
          )
          replace_once(
              service,
              '''            .map(|section| ArtistRefreshSectionResult {\n                section,\n                status,\n                retry_after_seconds,\n                cover_progress: None,\n            })\n''',
              '''            .map(|section| {\n                refresh_section_result(section, status, retry_after_seconds, None, None)\n            })\n'''
          )
          replace_once(
              service,
              '''fn refresh_transport_error(\n    error: &super::transport::TransportError,\n) -> (ArtistRefreshStatus, Option<u64>) {\n    use super::transport::TransportError;\n    match error {\n        TransportError::RateLimited {\n            retry_after_seconds,\n        } => (ArtistRefreshStatus::RateLimited, Some(*retry_after_seconds)),\n        TransportError::HttpStatus { status: 404, .. } => (ArtistRefreshStatus::NotFound, None),\n        TransportError::HttpStatus {\n            retry_after_seconds,\n            ..\n        } => (ArtistRefreshStatus::Unavailable, *retry_after_seconds),\n        _ => (ArtistRefreshStatus::Unavailable, None),\n    }\n}\n''',
              '''fn refresh_section_result(\n    section: ArtistRefreshSection,\n    status: ArtistRefreshStatus,\n    retry_after_seconds: Option<u64>,\n    cover_progress: Option<CoverRefreshProgress>,\n    diagnostic: Option<ArtistRefreshDiagnosticCode>,\n) -> ArtistRefreshSectionResult {\n    ArtistRefreshSectionResult {\n        section,\n        status,\n        retry_after_seconds,\n        cover_progress,\n        diagnostic,\n        provider: Some(match section {\n            ArtistRefreshSection::Profile => EnrichmentProvider::Wikidata,\n            ArtistRefreshSection::Portrait => EnrichmentProvider::Commons,\n            ArtistRefreshSection::Discography => EnrichmentProvider::MusicBrainz,\n            ArtistRefreshSection::Covers => EnrichmentProvider::CoverArtArchive,\n        }),\n    }\n}\n\nfn refresh_transport_error(\n    error: &super::transport::TransportError,\n) -> (\n    ArtistRefreshStatus,\n    Option<u64>,\n    Option<ArtistRefreshDiagnosticCode>,\n) {\n    use super::transport::TransportError;\n    use ArtistRefreshDiagnosticCode as Diagnostic;\n    match error {\n        TransportError::RateLimited { retry_after_seconds } => (\n            ArtistRefreshStatus::RateLimited,\n            Some(*retry_after_seconds),\n            None,\n        ),\n        TransportError::HttpStatus { status: 404, .. } => {\n            (ArtistRefreshStatus::NotFound, None, None)\n        }\n        TransportError::Timeout => (ArtistRefreshStatus::Unavailable, None, Some(Diagnostic::Timeout)),\n        TransportError::Connection => (\n            ArtistRefreshStatus::Unavailable,\n            None,\n            Some(Diagnostic::ConnectionFailed),\n        ),\n        TransportError::InvalidJson | TransportError::BodyTooLarge => (\n            ArtistRefreshStatus::Unavailable,\n            None,\n            Some(Diagnostic::InvalidResponse),\n        ),\n        TransportError::InvalidImage => (\n            ArtistRefreshStatus::Unavailable,\n            None,\n            Some(Diagnostic::InvalidImage),\n        ),\n        TransportError::Storage { extended_code } => {\n            let busy = extended_code.is_some_and(|code| matches!(code & 0xff, 5 | 6));\n            (\n                ArtistRefreshStatus::Unavailable,\n                None,\n                Some(if busy {\n                    Diagnostic::DatabaseBusy\n                } else {\n                    Diagnostic::ProviderUnavailable\n                }),\n            )\n        }\n        TransportError::HttpStatus { retry_after_seconds, .. } => (\n            ArtistRefreshStatus::Unavailable,\n            *retry_after_seconds,\n            Some(Diagnostic::ProviderUnavailable),\n        ),\n        _ => (\n            ArtistRefreshStatus::Unavailable,\n            None,\n            Some(Diagnostic::ProviderUnavailable),\n        ),\n    }\n}\n'''
          )

          # Add focused Rust unit coverage for the newly public diagnostic mapping.
          replace_once(
              service,
              '''    #[tokio::test]\n    async fn enrichment_writes_hold_one_publication_gate() {\n''',
              '''    #[test]\n    fn refresh_transport_errors_keep_actionable_diagnostics() {\n        use super::super::transport::TransportError;\n\n        let (status, retry, diagnostic) = refresh_transport_error(&TransportError::Storage {\n            extended_code: Some(5),\n        });\n        assert_eq!(status, ArtistRefreshStatus::Unavailable);\n        assert_eq!(retry, None);\n        assert_eq!(diagnostic, Some(ArtistRefreshDiagnosticCode::DatabaseBusy));\n\n        let (_, _, diagnostic) = refresh_transport_error(&TransportError::Timeout);\n        assert_eq!(diagnostic, Some(ArtistRefreshDiagnosticCode::Timeout));\n\n        let (_, _, diagnostic) = refresh_transport_error(&TransportError::InvalidJson);\n        assert_eq!(diagnostic, Some(ArtistRefreshDiagnosticCode::InvalidResponse));\n    }\n\n    #[tokio::test]\n    async fn enrichment_writes_hold_one_publication_gate() {\n'''
          )

          store = "durvald-macos/Durvald/Durvald/CoreBridge/DurvaldCoreStore.swift"
          replace_once(
              store,
              '''    /// Atualiza perfil/retrato explicitamente e sempre relê o cache local ao final.\n    /// Estados esperados como identidade pendente, offline ou conteúdo ausente não\n    /// são apresentados como erro global da aplicação.\n    func refreshArtistDetails(artistId: Int64, language: String) async -> ArtistDetails? {\n        guard let core else { return nil }\n        do {\n            _ = try await core.refreshArtist(\n                artistId: artistId,\n                request: ArtistRefreshRequest(\n                    sections: [.profile, .portrait],\n                    language: language,\n                    force: false\n                )\n            )\n            return try await core.artistDetails(artistId: artistId, language: language)\n        } catch {\n            errorMessage = String(describing: error)\n            return try? await core.artistDetails(artistId: artistId, language: language)\n        }\n    }\n''',
              '''    /// Atualiza perfil/retrato e preserva tanto o diagnóstico por seção quanto\n    /// a releitura do cache local. Falha remota não apaga conteúdo publicado.\n    func refreshArtistDetailsWithResult(\n        artistId: Int64,\n        language: String,\n        force: Bool = false\n    ) async -> (details: ArtistDetails?, result: ArtistRefreshResult?) {\n        guard let core else { return (nil, nil) }\n        do {\n            let result = try await core.refreshArtist(\n                artistId: artistId,\n                request: ArtistRefreshRequest(\n                    sections: [.profile, .portrait],\n                    language: language,\n                    force: force\n                )\n            )\n            let details = try await core.artistDetails(artistId: artistId, language: language)\n            return (details, result)\n        } catch {\n            errorMessage = String(describing: error)\n            return (try? await core.artistDetails(artistId: artistId, language: language), nil)\n        }\n    }\n\n    /// Compatibilidade para chamadores que só precisam do snapshot local.\n    func refreshArtistDetails(artistId: Int64, language: String) async -> ArtistDetails? {\n        await refreshArtistDetailsWithResult(artistId: artistId, language: language).details\n    }\n\n    /// Atualiza somente as seções solicitadas; usado pelos retries contextuais da UI.\n    func refreshArtistSections(\n        artistId: Int64,\n        language: String,\n        sections: [ArtistRefreshSection],\n        force: Bool = false\n    ) async -> ArtistRefreshResult? {\n        guard let core, !sections.isEmpty else { return nil }\n        do {\n            return try await core.refreshArtist(\n                artistId: artistId,\n                request: ArtistRefreshRequest(\n                    sections: sections,\n                    language: language,\n                    force: force\n                )\n            )\n        } catch {\n            errorMessage = String(describing: error)\n            return nil\n        }\n    }\n'''
          )

          diagnostics_swift = Path("durvald-macos/Durvald/Durvald/Features/Library/ArtistEnrichmentDiagnostics.swift")
          diagnostics_swift.write_text('''import Foundation\n\nenum ArtistEnrichmentDiagnostics {\n    static let orderedSections: [ArtistRefreshSection] = [\n        .profile, .portrait, .discography, .covers\n    ]\n\n    static func title(for section: ArtistRefreshSection) -> String {\n        switch section {\n        case .profile: "Perfil"\n        case .portrait: "Retrato"\n        case .discography: "Discografia"\n        case .covers: "Capas"\n        }\n    }\n\n    static func isRetryable(_ result: ArtistRefreshSectionResult) -> Bool {\n        switch result.status {\n        case .unavailable, .rateLimited, .partial:\n            true\n        default:\n            false\n        }\n    }\n\n    static func message(\n        for result: ArtistRefreshSectionResult,\n        hasCachedContent: Bool\n    ) -> String {\n        let cacheSuffix = hasCachedContent ? " O conteúdo do cache local foi preservado." : ""\n        if result.diagnostic == .databaseBusy {\n            return "Banco ocupado; tente novamente." + cacheSuffix\n        }\n        if result.diagnostic == .timeout {\n            return "O provedor demorou demais para responder." + cacheSuffix\n        }\n        if result.diagnostic == .connectionFailed {\n            return "Não foi possível conectar ao provedor." + cacheSuffix\n        }\n        if result.diagnostic == .invalidResponse {\n            return "O provedor retornou uma resposta inválida." + cacheSuffix\n        }\n        if result.diagnostic == .invalidImage {\n            return "A imagem recebida é inválida." + cacheSuffix\n        }\n\n        switch result.status {\n        case .updated:\n            return "Atualizado com sucesso."\n        case .unchanged:\n            return hasCachedContent ? "Conteúdo local atualizado e válido." : "Nenhuma alteração encontrada."\n        case .partial:\n            return result.section == .covers\n                ? "Ainda há capas pendentes; a atualização pode continuar."\n                : "A atualização está parcial e pode continuar."\n        case .notFound:\n            switch result.section {\n            case .profile: return "Nenhum perfil remoto foi encontrado."\n            case .portrait: return "Nenhum retrato remoto foi encontrado."\n            case .discography: return "Nenhuma discografia remota foi encontrada."\n            case .covers: return "Nenhuma capa foi encontrada para os itens consultados."\n            }\n        case .needsIdentity:\n            return "Confirme a identidade MusicBrainz para atualizar esta seção."\n        case .unavailable:\n            let providerName: String\n            switch result.provider {\n            case .coverArtArchive: providerName = "Cover Art Archive"\n            case .musicBrainz: providerName = "MusicBrainz"\n            case .commons: providerName = "Wikimedia Commons"\n            case .wikidata: providerName = "Wikidata"\n            case .wikipedia: providerName = "Wikipedia"\n            case .theAudioDb: providerName = "TheAudioDB"\n            case .youTube: providerName = "YouTube"\n            case nil: providerName = "Provedor remoto"\n            }\n            return "\\(providerName) indisponível." + cacheSuffix\n        case .rateLimited:\n            if let seconds = result.retryAfterSeconds {\n                return "Limite do provedor atingido. Tente novamente em \\(seconds) segundos." + cacheSuffix\n            }\n            return "Limite do provedor atingido. Tente novamente mais tarde." + cacheSuffix\n        case .disabled:\n            return "Enriquecimento remoto desativado nos Ajustes."\n        case .offline:\n            return hasCachedContent\n                ? "Modo offline: exibindo o cache local."\n                : "Modo offline: nenhum conteúdo remoto está armazenado."\n        case .superseded:\n            return "A identidade mudou durante a atualização; este resultado foi descartado."\n        }\n    }\n}\n''')

          view = "durvald-macos/Durvald/Durvald/Features/Library/ArtistView.swift"
          p = Path(view)
          text = p.read_text()
          text = text.replace("catalogRefreshResults", "enrichmentRefreshResults")
          text = text.replace("isRefreshingCatalog", "isRefreshingEnrichment")
          p.write_text(text)

          replace_once(
              view,
              '''                        identityCallout\n\n                        artistHighlights(width: geometry.size.width)\n''',
              '''                        identityCallout\n\n                        enrichmentDiagnostics\n\n                        artistHighlights(width: geometry.size.width)\n'''
          )
          replace_once(
              view,
              '''        async let refreshedDetails = store.refreshArtistDetails(\n            artistId: artist.id,\n            language: enrichmentLanguage\n        )\n        async let refreshedCatalog = store.refreshArtistCatalog(\n            artistId: artist.id,\n            language: enrichmentLanguage\n        )\n        let (newDetails, catalogResult) = await (refreshedDetails, refreshedCatalog)\n        if let newDetails {\n            details = newDetails\n        }\n        enrichmentRefreshResults = catalogResult?.sections ?? []\n''',
              '''        async let refreshedDetails = store.refreshArtistDetailsWithResult(\n            artistId: artist.id,\n            language: enrichmentLanguage\n        )\n        async let refreshedCatalog = store.refreshArtistCatalog(\n            artistId: artist.id,\n            language: enrichmentLanguage\n        )\n        let (detailsRefresh, catalogResult) = await (refreshedDetails, refreshedCatalog)\n        if let newDetails = detailsRefresh.details {\n            details = newDetails\n        }\n        enrichmentRefreshResults = mergeRefreshResults(\n            detailsRefresh.result?.sections ?? [],\n            catalogResult?.sections ?? []\n        )\n'''
          )
          replace_once(
              view,
              '''                if onlineOnlyReleases.isEmpty {\n                    Text(catalogStatusMessage ?? "Nenhum lançamento exclusivamente online no cache local.")\n                        .font(.subheadline)\n                        .foregroundStyle(.secondary)\n''',
              '''                if onlineOnlyReleases.isEmpty {\n                    Text("Nenhum lançamento exclusivamente online no cache local.")\n                        .font(.subheadline)\n                        .foregroundStyle(.secondary)\n'''
          )
          replace_once(
              view,
              '''                if let catalogStatusMessage, !onlineOnlyReleases.isEmpty {\n                    Text(catalogStatusMessage)\n                        .font(.caption)\n                        .foregroundStyle(.secondary)\n                }\n\n''',
              ''''''
          )
          old_status = '''    private var catalogStatusMessage: String? {\n        let statuses = enrichmentRefreshResults.map(\\.status)\n        if statuses.contains(.rateLimited) {\n            let retry = enrichmentRefreshResults.compactMap(\\.retryAfterSeconds).max()\n            return retry.map { "Limite do provedor atingido. Tente novamente em \\($0) segundos." }\n                ?? "Limite do provedor atingido. Tente novamente mais tarde."\n        }\n        if statuses.contains(.offline) { return "Modo offline: exibindo o cache local." }\n        if statuses.contains(.disabled) { return "Enriquecimento remoto desativado nos Ajustes." }\n        if statuses.contains(.needsIdentity) { return "Confirme a identidade MusicBrainz do artista para carregar a discografia." }\n        if statuses.contains(.unavailable) { return "Não foi possível atualizar agora; o cache local foi preservado." }\n        if statuses.contains(.superseded) { return "A identidade do artista mudou; os dados anteriores foram descartados." }\n        if statuses.contains(.partial) { return "Há mais páginas ou capas disponíveis para continuar." }\n        return nil\n    }\n\n'''
          if old_status not in Path(view).read_text():
              raise SystemExit("catalogStatusMessage block not found")
          Path(view).write_text(Path(view).read_text().replace(old_status, "", 1))

          replace_once(
              view,
              '''        enrichmentRefreshResults = result?.sections ?? []\n        if result != nil, let page = await store.artistDiscography(artistId: artist.id) {\n''',
              '''        if let result {\n            mergeRefreshResults(result.sections)\n        }\n        if result != nil, let page = await store.artistDiscography(artistId: artist.id) {\n'''
          )

          # Insert diagnostics UI and merge/retry helpers before applyDiscographyPage.
          replace_once(
              view,
              '''    private func applyDiscographyPage(_ page: ArtistDiscographyPage, reset: Bool) {\n''',
              '''    @ViewBuilder\n    private var enrichmentDiagnostics: some View {\n        if !enrichmentRefreshResults.isEmpty || isRefreshingEnrichment {\n            VStack(alignment: .leading, spacing: 12) {\n                HStack {\n                    Text("Atualização de metadados")\n                        .font(.headline)\n                    Spacer()\n                    if isRefreshingEnrichment {\n                        ProgressView()\n                            .controlSize(.small)\n                            .accessibilityLabel("Atualizando metadados")\n                    }\n                }\n\n                ForEach(Array(ArtistEnrichmentDiagnostics.orderedSections.enumerated()), id: \\.offset) { _, section in\n                    if let result = enrichmentRefreshResults.first(where: { $0.section == section }) {\n                        enrichmentDiagnosticRow(result)\n                    }\n                }\n            }\n            .padding(14)\n            .background(.quaternary, in: .rect(cornerRadius: 12))\n            .accessibilityIdentifier("artist.enrichment.diagnostics")\n        }\n    }\n\n    private func enrichmentDiagnosticRow(_ result: ArtistRefreshSectionResult) -> some View {\n        HStack(alignment: .top, spacing: 10) {\n            Image(systemName: diagnosticIcon(result.status))\n                .foregroundStyle(diagnosticColor(result.status))\n                .frame(width: 18)\n\n            VStack(alignment: .leading, spacing: 3) {\n                Text(ArtistEnrichmentDiagnostics.title(for: result.section))\n                    .font(.subheadline.weight(.semibold))\n                Text(ArtistEnrichmentDiagnostics.message(\n                    for: result,\n                    hasCachedContent: hasCachedContent(for: result.section)\n                ))\n                .font(.caption)\n                .foregroundStyle(.secondary)\n\n                if result.section == .covers, let progress = result.coverProgress {\n                    Text("\\(progress.completed) concluídas · \\(progress.pending) pendentes · \\(progress.absent) ausentes · \\(progress.temporarilyBlocked) bloqueadas")\n                        .font(.caption2)\n                        .foregroundStyle(.tertiary)\n                }\n            }\n\n            Spacer(minLength: 12)\n\n            if ArtistEnrichmentDiagnostics.isRetryable(result) {\n                Button("Tentar novamente") {\n                    Task { await retryEnrichmentSection(result.section) }\n                }\n                .buttonStyle(.bordered)\n                .controlSize(.small)\n                .disabled(isRefreshingEnrichment)\n                .accessibilityIdentifier("artist.enrichment.retry.\\(String(describing: result.section))")\n            }\n        }\n    }\n\n    private func diagnosticIcon(_ status: ArtistRefreshStatus) -> String {\n        switch status {\n        case .updated, .unchanged: "checkmark.circle.fill"\n        case .partial: "clock.arrow.circlepath"\n        case .notFound: "minus.circle"\n        case .needsIdentity: "person.crop.circle.badge.questionmark"\n        case .rateLimited: "hourglass.circle"\n        case .disabled, .offline: "icloud.slash"\n        case .superseded: "arrow.trianglehead.2.clockwise.rotate.90"\n        case .unavailable: "exclamationmark.triangle.fill"\n        }\n    }\n\n    private func diagnosticColor(_ status: ArtistRefreshStatus) -> Color {\n        switch status {\n        case .updated, .unchanged: .green\n        case .unavailable, .rateLimited: .orange\n        default: .secondary\n        }\n    }\n\n    private func hasCachedContent(for section: ArtistRefreshSection) -> Bool {\n        switch section {\n        case .profile:\n            return !(details?.sources.isEmpty ?? true)\n        case .portrait:\n            return details?.portrait != nil\n        case .discography:\n            return discographyPage?.catalogGeneration ?? 0 > 0 || !discographyItems.isEmpty\n        case .covers:\n            return discographyItems.contains { $0.artwork != nil }\n        }\n    }\n\n    private func mergeRefreshResults(_ groups: [ArtistRefreshSectionResult]...) -> [ArtistRefreshSectionResult] {\n        var merged: [ArtistRefreshSectionResult] = []\n        for result in groups.flatMap({ $0 }) {\n            if let index = merged.firstIndex(where: { $0.section == result.section }) {\n                merged[index] = result\n            } else {\n                merged.append(result)\n            }\n        }\n        return merged\n    }\n\n    private func mergeRefreshResults(_ incoming: [ArtistRefreshSectionResult]) {\n        enrichmentRefreshResults = mergeRefreshResults(enrichmentRefreshResults, incoming)\n    }\n\n    private func retryEnrichmentSection(_ section: ArtistRefreshSection) async {\n        guard !isRefreshingEnrichment else { return }\n        isRefreshingEnrichment = true\n        defer { isRefreshingEnrichment = false }\n\n        guard let result = await store.refreshArtistSections(\n            artistId: artist.id,\n            language: enrichmentLanguage,\n            sections: [section]\n        ) else { return }\n\n        mergeRefreshResults(result.sections)\n        switch section {\n        case .profile, .portrait:\n            details = await store.artistDetails(artistId: artist.id, language: enrichmentLanguage)\n        case .discography, .covers:\n            if let page = await store.artistDiscography(artistId: artist.id) {\n                applyDiscographyPage(page, reset: true)\n            }\n        }\n    }\n\n    private func applyDiscographyPage(_ page: ArtistDiscographyPage, reset: Bool) {\n'''
          )

          tests = Path("durvald-macos/Durvald/DurvaldTests/ArtistEnrichmentDiagnosticsTests.swift")
          tests.write_text('''import XCTest\n@testable import Durvald\n\nfinal class ArtistEnrichmentDiagnosticsTests: XCTestCase {\n    func testDatabaseBusyMessagePreservesCacheContext() {\n        let result = ArtistRefreshSectionResult(\n            section: .discography,\n            status: .unavailable,\n            retryAfterSeconds: nil,\n            coverProgress: nil,\n            diagnostic: .databaseBusy,\n            provider: .musicBrainz\n        )\n        XCTAssertEqual(\n            ArtistEnrichmentDiagnostics.message(for: result, hasCachedContent: true),\n            "Banco ocupado; tente novamente. O conteúdo do cache local foi preservado."\n        )\n        XCTAssertTrue(ArtistEnrichmentDiagnostics.isRetryable(result))\n    }\n\n    func testCoverArtArchiveFailureIsSectionSpecific() {\n        let result = ArtistRefreshSectionResult(\n            section: .covers,\n            status: .unavailable,\n            retryAfterSeconds: nil,\n            coverProgress: nil,\n            diagnostic: .providerUnavailable,\n            provider: .coverArtArchive\n        )\n        XCTAssertEqual(\n            ArtistEnrichmentDiagnostics.message(for: result, hasCachedContent: false),\n            "Cover Art Archive indisponível."\n        )\n    }\n\n    func testOnlyActionableStatusesAreRetryable() {\n        let make: (ArtistRefreshStatus) -> ArtistRefreshSectionResult = { status in\n            ArtistRefreshSectionResult(\n                section: .profile,\n                status: status,\n                retryAfterSeconds: nil,\n                coverProgress: nil,\n                diagnostic: nil,\n                provider: .wikidata\n            )\n        }\n        XCTAssertTrue(ArtistEnrichmentDiagnostics.isRetryable(make(.partial)))\n        XCTAssertTrue(ArtistEnrichmentDiagnostics.isRetryable(make(.rateLimited)))\n        XCTAssertTrue(ArtistEnrichmentDiagnostics.isRetryable(make(.unavailable)))\n        XCTAssertFalse(ArtistEnrichmentDiagnostics.isRetryable(make(.offline)))\n        XCTAssertFalse(ArtistEnrichmentDiagnostics.isRetryable(make(.notFound)))\n        XCTAssertFalse(ArtistEnrichmentDiagnostics.isRetryable(make(.needsIdentity)))\n    }\n}\n''')

      - name: Format and test Rust
        run: |
          cd durvald-core
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --package durvald-core
          cargo build --package durvald-core --features uniffi --release

      - name: Generate Swift bindings
        run: |
          ./durvald-core/scripts/generate-swift-bindings.sh

      - name: Build and test macOS client
        run: |
          cd durvald-macos/Durvald
          xcodebuild -project Durvald.xcodeproj -scheme Durvald -configuration Debug -destination 'platform=macOS' build
          xcodebuild -project Durvald.xcodeproj -scheme Durvald -destination 'platform=macOS' test

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-item5-section-diagnostics.yml
          git add \
            durvald-core/src/api/enrichment.rs \
            durvald-core/src/durvald.udl \
            durvald-core/src/enrichment/service.rs \
            durvald-macos/Durvald/Durvald/CoreBridge/DurvaldCoreStore.swift \
            durvald-macos/Durvald/Durvald/Features/Library/ArtistView.swift \
            durvald-macos/Durvald/Durvald/Features/Library/ArtistEnrichmentDiagnostics.swift \
            durvald-macos/Durvald/DurvaldTests/ArtistEnrichmentDiagnosticsTests.swift \
            durvald-macos/Durvald/Durvald/durvald_core.swift \
            .github/workflows/apply-item5-section-diagnostics.yml
          git commit -m "Implement section-level enrichment diagnostics"
          git push origin HEAD:codex/item-5-section-diagnostics
