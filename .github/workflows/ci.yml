name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  rust-core:
    name: Rust Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            durvald-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libudev-dev
      
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: durvald-core
      
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: durvald-core
      
      - name: Build core library (default features)
        run: cargo build --package durvald-core
        working-directory: durvald-core
      
      - name: Build core library with UniFFI
        run: cargo build --package durvald-core --features uniffi
        working-directory: durvald-core
      
      - name: Run tests
        run: cargo test --package durvald-core
        working-directory: durvald-core

  rust-core-macos:
    name: Rust Core (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            durvald-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: durvald-core
      
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: durvald-core
      
      - name: Build core library (default features)
        run: cargo build --package durvald-core
        working-directory: durvald-core
      
      - name: Build core library with UniFFI
        run: cargo build --package durvald-core --features uniffi
        working-directory: durvald-core
      
      - name: Run tests
        run: cargo test --package durvald-core
        working-directory: durvald-core

  macos-client:
    name: macOS Client
    runs-on: macos-latest
    needs: rust-core-macos
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            durvald-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Generate UniFFI Swift bindings
        run: ./durvald-core/scripts/generate-swift-bindings.sh

      - name: Build macOS client
        run: |
          xcodebuild \
            -project durvald-macos/Durvald/Durvald.xcodeproj \
            -scheme Durvald \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DurvaldDerivedData" \
            build

      - name: Run macOS unit tests
        run: |
          xcodebuild \
            -project durvald-macos/Durvald/Durvald.xcodeproj \
            -scheme Durvald \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DurvaldDerivedData" \
            -only-testing:DurvaldTests \
            test

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev pkg-config libasound2-dev libudev-dev

      - name: Generate docs
        run: cargo doc --locked --package durvald-core --no-deps --document-private-items
        working-directory: durvald-core
      
      - name: Check for broken links
        run: |
          cargo install broken-link-checker --locked || true
          # blc http://localhost:3000 --filter-level 3 || true
