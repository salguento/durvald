[package]
name = "durvald-core"
version = "0.1.0"
edition = "2024"
description = "Core business logic for durvald music player - database, audio, metadata, Last.fm, secure storage"
license = "MIT"
rust-version = "1.85"

[lib]
name = "durvald_core"
path = "src/lib.rs"
# cdylib = dynamic library for FFI (Swift, Kotlin, Python, Node.js)
# staticlib = static library for GTK4/Rust consumers
crate-type = ["cdylib", "staticlib", "lib"]

[features]
# Default features for the core library
default = []
# UniFFI bindings generation (enables uniffi::export macros)
uniffi = ["dep:uniffi", "uniffi/tokio"]

[dependencies]
# Database
rusqlite = { version = "0.37.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-rusqlite = "0.7.0"

# Audio
# MVP playback formats: MP3, WAV, FLAC, and Ogg Vorbis (.ogg/.oga). Keep this
# aligned with `audio::SUPPORTED_AUDIO_EXTENSIONS`; Kira 0.11 has no AAC, M4A,
# Opus, or AIFF decoder feature to enable here.
kira = { version = "0.11.0", features = ["mp3", "ogg", "flac", "wav"] }

# Metadata
lofty = "0.22.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22.1"
md-5 = "0.10.6"

# Last.fm
reqwest = { version = "0.13.1", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = { version = "0.10.6", package = "md-5" }
ring = "0.17.14"
lazy_static = "1.5.0"
chrono = "0.4.42"
thiserror = "2.0.17"
once_cell = "1.21.3"
zeroize = "1.8.2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

# Utilities
sys-info = "0.9"

# UniFFI - only compiled when "uniffi" feature is enabled
uniffi = { version = "0.27", features = ["tokio", "cli"], optional = true }

[build-dependencies]
# Required for code generation at build time (always available for build.rs)
uniffi_build = { version = "0.27", features = ["builtin-bindgen"] }

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
# CoreFoundation needed for keyring on macOS
core-foundation = "0.9"

[target.'cfg(windows)'.dependencies]
# Windows-specific for secure storage
windows = { version = "0.58", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[profile.release]
# Optimize for size - important for mobile/embedded
lto = true
codegen-units = 1
strip = true
panic = "abort"
